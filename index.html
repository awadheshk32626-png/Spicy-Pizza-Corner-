<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SPC'S Pizza Corner</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
}
header{
  background:#111;
  color:white;
  padding:22px 15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{margin:0;font-size:26px}
header p{margin:7px 0 0;color:#ddd}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.category{
  margin:25px 0;
}
.category-title{
  background:#111;
  color:white;
  padding:13px 15px;
  border-radius:10px;
  font-size:20px;
  margin-bottom:14px;
}

.items{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 10px #0001;
  border:1px solid #eee;
}

.pizza-img{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#eee;
}

.no-img{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  font-size:55px;
}

.card-content{padding:15px}
.card h3{margin:0 0 7px;font-size:18px}
.desc{
  font-size:13px;
  color:#666;
  min-height:40px;
  line-height:1.5;
}

select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:8px;
  background:white;
  font-size:14px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  cursor:pointer;
}

.add-btn{
  width:100%;
  background:#111;
  color:white;
  font-size:15px;
  font-weight:bold;
}

.toppings{
  margin:8px 0;
  padding:9px;
  background:#fafafa;
  border-radius:8px;
  font-size:13px;
}

.toppings label{
  display:inline-block;
  margin:4px 5px 4px 0;
}

.cart{
  position:fixed;
  right:15px;
  bottom:15px;
  width:340px;
  max-width:calc(100% - 30px);
  background:white;
  border-radius:15px;
  box-shadow:0 5px 25px #0003;
  z-index:20;
  overflow:hidden;
}

.cart-head{
  background:#111;
  color:white;
  padding:14px;
  font-weight:bold;
}

.cart-body{
  max-height:300px;
  overflow:auto;
  padding:10px;
}

.cart-item{
  border-bottom:1px solid #eee;
  padding:10px 0;
}

.cart-name{font-weight:bold}
.cart-info{
  font-size:12px;
  color:#666;
  margin:4px 0;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
}

.qty button{
  width:30px;
  height:30px;
  padding:0;
  background:#eee;
  font-size:18px;
}

.cart-foot{
  padding:14px;
  border-top:1px solid #eee;
  font-size:18px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#888;
  padding:20px;
}

@media(max-width:600px){
  header h1{font-size:22px}
  .items{grid-template-columns:1fr}
  .cart{
    position:fixed;
    bottom:10px;
    right:10px;
    width:calc(100% - 20px);
  }
}
</style>
</head>

function money(n){

}

function makeId(category,item){
 return (category+"-"+item).replace(/[^a-zA-Z0-9]/g,"");
}

function renderMenu(){

   const section=document.createElement("section");
   section.className="category";

       <div class="card-content">

         <h3>${item[0]}</h3>

         <div class="desc">${item[1]}</div>

         <select id="size-${id}" onchange="updatePrice('${id}',${ci})">
           <option value="Regular">Regular</option>
           <option value="Medium">Medium</option>
           <option value="Large">Large</option>
         </select>

         <select id="cheese-${id}" onchange="updatePrice('${id}',${ci})">

         <div class="price">

           ${cat.prices.single.Regular}

         </div>

           onclick="addToCart(${ci},${ii},'${id}')">
           🛒 Add to Cart
         </button>

       </div>
     `;

     itemsBox.appendChild(card);
   });
 });
}

function updatePrice(id,ci){

 const size=document.getElementById("size-"+id).value;
 const cheese=document.getElementById("cheese-"+id).value;

 const price=categories[ci].prices[cheese][size];

 document.getElementById("price-"+id).innerText=money(price);
}
